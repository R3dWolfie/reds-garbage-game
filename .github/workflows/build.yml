name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pygame pyinstaller requests numpy

      - name: Build EXE
        run: |
          python -m PyInstaller --name="RedsGarbageGame" --onedir --noconsole --add-data="core;core" --add-data="entities;entities" --add-data="game;game" --add-data="ui;ui" --add-data="networking;networking" --add-data="updater;updater" --add-data="config.json;." main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RedsGarbageGame-Windows
          path: dist/RedsGarbageGame/