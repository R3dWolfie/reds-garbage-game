name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.3.4)'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pygame pyinstaller numpy

      - name: Build EXE
        run: |
          python -m PyInstaller --name="RedsGarbageGame" --onedir --noconsole --add-data="core;core" --add-data="entities;entities" --add-data="game;game" --add-data="ui;ui" --add-data="networking;networking" --add-data="updater;updater" --add-data="config.json;." main.py

      - name: Create zip
        run: |
          cd dist
          Compress-Archive -Path RedsGarbageGame -DestinationPath RedsGarbageGame-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedsGarbageGame-Windows
          path: dist/RedsGarbageGame-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev
          pip install pygame pyinstaller numpy

      - name: Build
        run: |
          if [ -f build_linux.spec ]; then
            python -m PyInstaller build_linux.spec --noconfirm --clean
          else
            python -m PyInstaller --name="RedsGarbageGame" --onedir --noconsole --add-data="core:core" --add-data="entities:entities" --add-data="game:game" --add-data="ui:ui" --add-data="networking:networking" --add-data="updater:updater" --add-data="config.json:." main.py
          fi

      - name: Package
        run: |
          chmod +x dist/RedsGarbageGame/RedsGarbageGame
          cat > dist/RedsGarbageGame/run.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./RedsGarbageGame "$@"
          EOF
          chmod +x dist/RedsGarbageGame/run.sh
          cd dist
          tar -czf RedsGarbageGame-linux-x86_64.tar.gz RedsGarbageGame/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedsGarbageGame-Linux
          path: dist/RedsGarbageGame-linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pygame pyinstaller numpy

      - name: Build
        run: |
          if [ -f build_macos.spec ]; then
            python -m PyInstaller build_macos.spec --noconfirm --clean
          else
            python -m PyInstaller --name="RedsGarbageGame" --onedir --noconsole --add-data="core:core" --add-data="entities:entities" --add-data="game:game" --add-data="ui:ui" --add-data="networking:networking" --add-data="updater:updater" --add-data="config.json:." main.py
          fi

      - name: Package
        run: |
          chmod +x dist/RedsGarbageGame/RedsGarbageGame
          cat > dist/RedsGarbageGame/run.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./RedsGarbageGame "$@"
          EOF
          chmod +x dist/RedsGarbageGame/run.sh
          cd dist
          tar -czf RedsGarbageGame-macos.tar.gz RedsGarbageGame/

      - name: Create DMG
        run: |
          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          
          # If .app bundle exists, use it; otherwise create one from the folder build
          if [ -d "dist/Red's Garbage Game.app" ]; then
            cp -R "dist/Red's Garbage Game.app" "dmg_contents/Red's Garbage Game.app"
          else
            # Create a minimal .app wrapper around the folder build
            APP="dmg_contents/Red's Garbage Game.app"
            mkdir -p "$APP/Contents/MacOS"
            mkdir -p "$APP/Contents/Resources"
            
            # Copy all game files into Resources
            cp -R dist/RedsGarbageGame/* "$APP/Contents/Resources/"
            
            # Create launcher script
            cat > "$APP/Contents/MacOS/RedsGarbageGame" << 'LAUNCHER'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")/../Resources" && pwd)"
          cd "$DIR"
          exec "./RedsGarbageGame" "$@"
          LAUNCHER
            chmod +x "$APP/Contents/MacOS/RedsGarbageGame"
            
            # Create Info.plist
            cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Red's Garbage Game</string>
            <key>CFBundleDisplayName</key>
            <string>Red's Garbage Game</string>
            <key>CFBundleIdentifier</key>
            <string>com.r3dwolfie.redsgarbagegame</string>
            <key>CFBundleExecutable</key>
            <string>RedsGarbageGame</string>
            <key>CFBundleVersion</key>
            <string>0.3.4</string>
            <key>CFBundleShortVersionString</key>
            <string>0.3.4</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
          </dict>
          </plist>
          PLIST
          fi
          
          # Create DMG
          hdiutil create -volname "Red's Garbage Game" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "dist/RedsGarbageGame-macos.dmg"

      - name: Upload tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: RedsGarbageGame-macOS
          path: dist/RedsGarbageGame-macos.tar.gz

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: RedsGarbageGame-macOS-DMG
          path: dist/RedsGarbageGame-macos.dmg